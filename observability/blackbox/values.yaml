replicas: 1

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: ip4

serviceMonitor:
  enabled: false

# Prometheus Operator Probe CR discovers this prober via URL below
service:
  type: ClusterIP
  port: 9115
