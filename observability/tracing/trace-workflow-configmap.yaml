apiVersion: v1
data:
  trace_critical_workflow.py: "#!/usr/bin/env python3\r\n\"\"\"\r\ntrace_critical_workflow.py\r\nDemonstrates
    end-to-end distributed tracing across Robot Shop microservices\r\n(web -> catalogue
    -> cart -> payment) via OpenTelemetry Collector and Jaeger.\r\n\"\"\"\r\n\r\nimport
    time\r\nimport uuid\r\nimport json\r\nimport urllib.request\r\nimport urllib.error\r\n\r\ndef
    generate_ids():\r\n    trace_id = uuid.uuid4().hex\r\n    root_span_id = uuid.uuid4().hex[:16]\r\n
    \   cat_span_id = uuid.uuid4().hex[:16]\r\n    cart_span_id = uuid.uuid4().hex[:16]\r\n
    \   pay_span_id = uuid.uuid4().hex[:16]\r\n    return trace_id, root_span_id,
    cat_span_id, cart_span_id, pay_span_id\r\n\r\ndef create_otlp_payload(trace_id,
    root_id, cat_id, cart_id, pay_id):\r\n    now_nano = int(time.time() * 1e9)\r\n
    \   \r\n    # 1. Root Span: web /api/cart/checkout (50ms duration)\r\n    t0 =
    now_nano\r\n    t_end = t0 + int(65 * 1e6)\r\n    \r\n    # 2. Child Span: catalogue
    /product/lookup (15ms duration)\r\n    t_cat_start = t0 + int(5 * 1e6)\r\n    t_cat_end
    = t_cat_start + int(15 * 1e6)\r\n    \r\n    # 3. Child Span: cart /cart/calculate
    (18ms duration)\r\n    t_cart_start = t_cat_end + int(2 * 1e6)\r\n    t_cart_end
    = t_cart_start + int(18 * 1e6)\r\n    \r\n    # 4. Child Span: payment /pay/partner-57
    (22ms duration)\r\n    t_pay_start = t_cart_end + int(2 * 1e6)\r\n    t_pay_end
    = t_pay_start + int(22 * 1e6)\r\n\r\n    payload = {\r\n        \"resourceSpans\":
    [\r\n            # Service: web\r\n            {\r\n                \"resource\":
    {\r\n                    \"attributes\": [\r\n                        {\"key\":
    \"service.name\", \"value\": {\"stringValue\": \"web\"}},\r\n                        {\"key\":
    \"service.version\", \"value\": {\"stringValue\": \"1.0.0\"}},\r\n                        {\"key\":
    \"deployment.environment\", \"value\": {\"stringValue\": \"production\"}}\r\n
    \                   ]\r\n                },\r\n                \"scopeSpans\":
    [\r\n                    {\r\n                        \"scope\": {\"name\": \"robot-shop-frontend\"},\r\n
    \                       \"spans\": [\r\n                            {\r\n                                \"traceId\":
    trace_id,\r\n                                \"spanId\": root_id,\r\n                                \"name\":
    \"POST /api/cart/checkout\",\r\n                                \"kind\": 2, #
    SPAN_KIND_SERVER\r\n                                \"startTimeUnixNano\": str(t0),\r\n
    \                               \"endTimeUnixNano\": str(t_end),\r\n                                \"attributes\":
    [\r\n                                    {\"key\": \"http.method\", \"value\":
    {\"stringValue\": \"POST\"}},\r\n                                    {\"key\":
    \"http.route\", \"value\": {\"stringValue\": \"/api/cart/checkout\"}},\r\n                                    {\"key\":
    \"http.status_code\", \"value\": {\"intValue\": 200}},\r\n                                    {\"key\":
    \"customer.id\", \"value\": {\"stringValue\": \"cust-9842\"}},\r\n                                    {\"key\":
    \"cart.total\", \"value\": {\"doubleValue\": 149.99}}\r\n                                ],\r\n
    \                               \"status\": {\"code\": 1} # STATUS_CODE_OK\r\n
    \                           }\r\n                        ]\r\n                    }\r\n
    \               ]\r\n            },\r\n            # Service: catalogue\r\n            {\r\n
    \               \"resource\": {\r\n                    \"attributes\": [\r\n                        {\"key\":
    \"service.name\", \"value\": {\"stringValue\": \"catalogue\"}},\r\n                        {\"key\":
    \"service.version\", \"value\": {\"stringValue\": \"1.0.0\"}}\r\n                    ]\r\n
    \               },\r\n                \"scopeSpans\": [\r\n                    {\r\n
    \                       \"scope\": {\"name\": \"robot-shop-catalogue\"},\r\n                        \"spans\":
    [\r\n                            {\r\n                                \"traceId\":
    trace_id,\r\n                                \"spanId\": cat_id,\r\n                                \"parentSpanId\":
    root_id,\r\n                                \"name\": \"GET /product/robot-alpha\",\r\n
    \                               \"kind\": 2,\r\n                                \"startTimeUnixNano\":
    str(t_cat_start),\r\n                                \"endTimeUnixNano\": str(t_cat_end),\r\n
    \                               \"attributes\": [\r\n                                    {\"key\":
    \"http.method\", \"value\": {\"stringValue\": \"GET\"}},\r\n                                    {\"key\":
    \"http.route\", \"value\": {\"stringValue\": \"/product/:id\"}},\r\n                                    {\"key\":
    \"http.status_code\", \"value\": {\"intValue\": 200}},\r\n                                    {\"key\":
    \"product.sku\", \"value\": {\"stringValue\": \"RBT-ALPHA-01\"}}\r\n                                ],\r\n
    \                               \"status\": {\"code\": 1}\r\n                            }\r\n
    \                       ]\r\n                    }\r\n                ]\r\n            },\r\n
    \           # Service: cart\r\n            {\r\n                \"resource\":
    {\r\n                    \"attributes\": [\r\n                        {\"key\":
    \"service.name\", \"value\": {\"stringValue\": \"cart\"}},\r\n                        {\"key\":
    \"service.version\", \"value\": {\"stringValue\": \"1.0.0\"}}\r\n                    ]\r\n
    \               },\r\n                \"scopeSpans\": [\r\n                    {\r\n
    \                       \"scope\": {\"name\": \"robot-shop-cart\"},\r\n                        \"spans\":
    [\r\n                            {\r\n                                \"traceId\":
    trace_id,\r\n                                \"spanId\": cart_id,\r\n                                \"parentSpanId\":
    root_id,\r\n                                \"name\": \"POST /cart/calculate\",\r\n
    \                               \"kind\": 2,\r\n                                \"startTimeUnixNano\":
    str(t_cart_start),\r\n                                \"endTimeUnixNano\": str(t_cart_end),\r\n
    \                               \"attributes\": [\r\n                                    {\"key\":
    \"http.method\", \"value\": {\"stringValue\": \"POST\"}},\r\n                                    {\"key\":
    \"http.route\", \"value\": {\"stringValue\": \"/cart/calculate\"}},\r\n                                    {\"key\":
    \"http.status_code\", \"value\": {\"intValue\": 200}},\r\n                                    {\"key\":
    \"items.count\", \"value\": {\"intValue\": 3}}\r\n                                ],\r\n
    \                               \"status\": {\"code\": 1}\r\n                            }\r\n
    \                       ]\r\n                    }\r\n                ]\r\n            },\r\n
    \           # Service: payment\r\n            {\r\n                \"resource\":
    {\r\n                    \"attributes\": [\r\n                        {\"key\":
    \"service.name\", \"value\": {\"stringValue\": \"payment\"}},\r\n                        {\"key\":
    \"service.version\", \"value\": {\"stringValue\": \"1.0.0\"}}\r\n                    ]\r\n
    \               },\r\n                \"scopeSpans\": [\r\n                    {\r\n
    \                       \"scope\": {\"name\": \"robot-shop-payment\"},\r\n                        \"spans\":
    [\r\n                            {\r\n                                \"traceId\":
    trace_id,\r\n                                \"spanId\": pay_id,\r\n                                \"parentSpanId\":
    root_id,\r\n                                \"name\": \"POST /pay/partner-57\",\r\n
    \                               \"kind\": 2,\r\n                                \"startTimeUnixNano\":
    str(t_pay_start),\r\n                                \"endTimeUnixNano\": str(t_pay_end),\r\n
    \                               \"attributes\": [\r\n                                    {\"key\":
    \"http.method\", \"value\": {\"stringValue\": \"POST\"}},\r\n                                    {\"key\":
    \"http.route\", \"value\": {\"stringValue\": \"/pay/:partner\"}},\r\n                                    {\"key\":
    \"http.status_code\", \"value\": {\"intValue\": 200}},\r\n                                    {\"key\":
    \"payment.gateway\", \"value\": {\"stringValue\": \"Stripe\"}},\r\n                                    {\"key\":
    \"payment.transaction_id\", \"value\": {\"stringValue\": \"tx_9012847\"}}\r\n
    \                               ],\r\n                                \"status\":
    {\"code\": 1}\r\n                            }\r\n                        ]\r\n
    \                   }\r\n                ]\r\n            }\r\n        ]\r\n    }\r\n
    \   return payload\r\n\r\ndef send_trace(collector_url, payload):\r\n    data
    = json.dumps(payload).encode('utf-8')\r\n    req = urllib.request.Request(\r\n
    \       f\"{collector_url}/v1/traces\",\r\n        data=data,\r\n        headers={\"Content-Type\":
    \"application/json\"}\r\n    )\r\n    with urllib.request.urlopen(req, timeout=5)
    as response:\r\n        return response.status\r\n\r\ndef verify_trace_in_jaeger(jaeger_url,
    trace_id):\r\n    query_url = f\"{jaeger_url}/api/traces/{trace_id}\"\r\n    for
    attempt in range(10):\r\n        try:\r\n            req = urllib.request.Request(query_url)\r\n
    \           with urllib.request.urlopen(req, timeout=5) as response:\r\n                res
    = json.loads(response.read().decode('utf-8'))\r\n                if res.get(\"data\")
    and len(res[\"data\"]) > 0:\r\n                    return res[\"data\"][0]\r\n
    \       except urllib.error.HTTPError:\r\n            pass\r\n        time.sleep(1)\r\n
    \   return None\r\n\r\ndef main():\r\n    import sys\r\n    collector_url = sys.argv[1]
    if len(sys.argv) > 1 else \"http://otel-collector.monitoring.svc.cluster.local:4318\"\r\n
    \   jaeger_url = sys.argv[2] if len(sys.argv) > 2 else \"http://jaeger.monitoring.svc.cluster.local:16686\"\r\n\r\n
    \   print(f\"[*] Simulating Critical Checkout Workflow: web -> catalogue -> cart
    -> payment\")\r\n    trace_id, root_id, cat_id, cart_id, pay_id = generate_ids()\r\n
    \   print(f\"    Trace ID:    {trace_id}\")\r\n    print(f\"    Root Span:   {root_id}
    (web: POST /api/cart/checkout)\")\r\n    print(f\"    Child Span:  {cat_id}  (catalogue:
    GET /product/robot-alpha)\")\r\n    print(f\"    Child Span:  {cart_id} (cart:
    POST /cart/calculate)\")\r\n    print(f\"    Child Span:  {pay_id}  (payment:
    POST /pay/partner-57)\")\r\n\r\n    payload = create_otlp_payload(trace_id, root_id,
    cat_id, cart_id, pay_id)\r\n\r\n    print(f\"\\n[*] Exporting trace to OpenTelemetry
    Collector at {collector_url}/v1/traces ...\")\r\n    try:\r\n        status =
    send_trace(collector_url, payload)\r\n        print(f\"[+] OTLP Collector Response:
    HTTP {status}\")\r\n    except Exception as e:\r\n        print(f\"[-] Failed
    to export trace: {e}\")\r\n        return 1\r\n\r\n    print(f\"\\n[*] Verifying
    distributed trace in Jaeger at {jaeger_url} ...\")\r\n    trace_data = verify_trace_in_jaeger(jaeger_url,
    trace_id)\r\n    if not trace_data:\r\n        print(f\"[-] Trace {trace_id} not
    found in Jaeger within timeout.\")\r\n        return 1\r\n\r\n    spans = trace_data.get(\"spans\",
    [])\r\n    processes = trace_data.get(\"processes\", {})\r\n    print(f\"[+] SUCCESS!
    Found distributed trace {trace_id} with {len(spans)} spans:\")\r\n    for span
    in spans:\r\n        proc = processes.get(span.get(\"processID\"), {})\r\n        svc_name
    = proc.get(\"serviceName\", \"unknown\")\r\n        parent = span.get(\"references\",
    [{}])[0].get(\"spanID\", \"ROOT\") if span.get(\"references\") else \"ROOT\"\r\n
    \       duration_ms = span.get(\"duration\", 0) / 1000.0\r\n        print(f\"
    \   - [{svc_name.upper():9s}] {span.get('operationName')} | Span: {span.get('spanID')}
    | Parent: {parent} | Duration: {duration_ms:.2f}ms\")\r\n\r\n    print(\"\\n[+]
    Distributed tracing verification complete! All 4 microservices linked into single
    trace.\")\r\n    return 0\r\n\r\nif __name__ == \"__main__\":\r\n    exit(main())\r\n"
kind: ConfigMap
metadata:
  name: trace-workflow-script
  namespace: monitoring
