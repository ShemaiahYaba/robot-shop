# Fluent Bit → Loki for Robot Shop (service + level labels)
kind: DaemonSet

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 96Mi

testFramework:
  enabled: false

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*_robot-shop_*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off

    # Map pino numeric levels into readable level label when present
    [FILTER]
        Name           modify
        Match          kube.*
        Condition      Key_Value_Equals level 50
        Set            level error
    [FILTER]
        Name           modify
        Match          kube.*
        Condition      Key_Value_Equals level 40
        Set            level warn
    [FILTER]
        Name           modify
        Match          kube.*
        Condition      Key_Value_Equals level 30
        Set            level info
    [FILTER]
        Name           modify
        Match          kube.*
        Condition      Key_Value_Equals level 20
        Set            level debug

  outputs: |
    [OUTPUT]
        Name                      loki
        Match                     kube.*
        Host                      loki-gateway.monitoring.svc.cluster.local
        Port                      80
        URI                       /loki/api/v1/push
        Labels                    job=fluent-bit
        Auto_Kubernetes_Labels    on
        Label_Keys                $level
        Line_Format               json
        Remove_Keys               stream, _p

  customParsers: |
    [PARSER]
        Name        docker_no_time
        Format      json
        Time_Keep   Off
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
